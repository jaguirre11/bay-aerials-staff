<style>
  :root {
    --bg: #faf6f0;
    --ink: #1a1410;
    --muted: #6b5d54;
    --line: #e8dfd2;
    --card: #ffffff;
    --accent: #e85d2f;
    --accent-soft: #fff1ea;

    --c-peas: #d4477a;
    --c-peas-soft: #fde7ef;
    --c-rec: #2c7da0;
    --c-rec-soft: #e1f0f7;
    --c-ninja: #5a3a8a;
    --c-ninja-soft: #ece4f7;
    --c-silks: #c89400;
    --c-silks-soft: #fbf3d8;
    --c-admin: #4a5c3a;
    --c-admin-soft: #ebf0e3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(232, 93, 47, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(212, 71, 122, 0.05) 0%, transparent 40%);
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  header {
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .logo {
    display: block;
    width: auto;
    height: 80px;
    max-width: 100%;
    margin-bottom: 16px;
  }

  @media (max-width: 600px) {
    .logo { height: 64px; margin-bottom: 12px; }
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 800;
    font-size: clamp(34px, 7vw, 52px);
    line-height: 1.0;
    letter-spacing: -0.025em;
    margin-bottom: 6px;
  }

  h1 em {
    font-style: italic;
    font-weight: 600;
    color: var(--accent);
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    max-width: 520px;
  }

  .search-box {
    margin: 24px 0 8px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 16px 20px 16px 48px;
    font-family: inherit;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .search-box svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .status {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .status.error {
    color: #b34225;
    background: #fdebe4;
    border-radius: 14px;
    margin-top: 20px;
    text-align: left;
    padding: 20px 24px;
    font-size: 14px;
    line-height: 1.6;
  }

  .status.error code {
    background: rgba(0,0,0,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  .category {
    margin-top: 36px;
  }

  .category-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--line);
  }

  .category-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .category-count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    background: var(--card);
    padding: 3px 9px;
    border-radius: 99px;
    border: 1px solid var(--line);
  }

  .links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.12s ease, border-color 0.12s, box-shadow 0.12s;
    min-height: 56px;
  }

  .link-card:hover, .link-card:focus-visible {
    transform: translateY(-1px);
    border-color: var(--ink);
    box-shadow: 0 4px 16px rgba(26, 20, 16, 0.08);
    outline: none;
  }

  .link-card:active {
    transform: translateY(0);
  }

  .link-icon {
    font-size: 22px;
    flex-shrink: 0;
    line-height: 1;
    width: 32px;
    text-align: center;
  }

  .link-label {
    font-weight: 500;
    font-size: 15px;
    line-height: 1.3;
    flex: 1;
  }

  .link-arrow {
    color: var(--muted);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s, transform 0.12s;
  }

  .link-card:hover .link-arrow {
    opacity: 1;
    transform: translateX(2px);
  }

  /* Category color stripes */
  [data-cat="peas"] .category-title::before,
  [data-cat="rec"] .category-title::before,
  [data-cat="ninja"] .category-title::before,
  [data-cat="silks"] .category-title::before,
  [data-cat="admin"] .category-title::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 10px;
    transform: translateY(-2px);
  }
  [data-cat="peas"]  .category-title::before { background: var(--c-peas); }
  [data-cat="rec"]   .category-title::before { background: var(--c-rec); }
  [data-cat="ninja"] .category-title::before { background: var(--c-ninja); }
  [data-cat="silks"] .category-title::before { background: var(--c-silks); }
  [data-cat="admin"] .category-title::before { background: var(--c-admin); }

  .empty-search {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }

  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  footer a { color: var(--muted); }

  @media (max-width: 600px) {
    .wrap { padding: 20px 16px 80px; }
    .links { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

    <h1>Staff info <em>at your fingertips</em></h1>
    <p class="subtitle">Lesson plans, schedules, and resources. Tap any link to open.</p>

    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="search" placeholder="Search all resources… (e.g. 'three peas', 'ninja warm up')" autocomplete="off">
    </div>
  </header>

  <main id="content">
    <div class="status" id="status">Loading resources…</div>
  </main>

  <footer>
    Managed via Google Sheets · <a href="#" id="reload-link">Reload</a>
  </footer>
</div>

<script>
  // ====================================================================
  // CONFIG — Paste your published Google Sheet CSV URL here.
  // To get this URL:
  //   1. Open your Google Sheet
  //   2. File → Share → Publish to web
  //   3. Choose your sheet tab, format = "Comma-separated values (.csv)"
  //   4. Copy the URL it gives you and paste below
  // ====================================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9WDHd3czyIGMMxRAx_I8F9ITdpmh0i1BeFXy_8x10iOGAlC3uJTPr9mpvAcEVDUMc1OXqcFXg9KMQ/pub?output=csv";

  // Categories defined here — order shown is the order on page.
  // Match values to the "Category" column in your sheet (case-insensitive).
  const CATEGORIES = [
    { key: 'admin',  label: 'Events & Handbook' },
    { key: 'peas',   label: 'Sweet Peas' },
    { key: 'rec',    label: 'Recreational Gymnastics' },
    { key: 'ninja',  label: 'Fremont Ninja' },
    { key: 'silks',  label: 'Aerial Silks' },
  ];

  // ============================================================

  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  const searchEl = document.getElementById('search');
  document.getElementById('reload-link').onclick = e => { e.preventDefault(); location.reload(); };

  let allRows = [];

  function showError(msg) {
    statusEl.className = 'status error';
    statusEl.innerHTML = msg;
  }

  // Tiny CSV parser that handles quoted fields with commas and newlines.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.some(v => v !== '')) rows.push(row);
          row = [];
        } else { field += c; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToObjects(rows) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1).map(r => {
      const o = {};
      headers.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
      return o;
    });
  }

  function render(rows) {
    if (!rows.length) {
      contentEl.innerHTML = '<div class="empty-search">No matches.</div>';
      return;
    }

    const grouped = {};
    CATEGORIES.forEach(c => grouped[c.key] = []);
    rows.forEach(r => {
      const cat = (r.category || '').toLowerCase();
      if (grouped[cat]) grouped[cat].push(r);
      else { (grouped['_other'] = grouped['_other'] || []).push(r); }
    });

    let html = '';
    CATEGORIES.forEach(c => {
      const items = grouped[c.key];
      if (!items.length) return;
      html += `<section class="category" data-cat="${c.key}">`;
      html += `<div class="category-head">`;
      html += `<h2 class="category-title">${escapeHtml(c.label)}</h2>`;
      html += `<span class="category-count">${items.length}</span>`;
      html += `</div><div class="links">`;
      items.forEach(item => {
        const icon = item.icon || '📄';
        const label = item.label || 'Untitled';
        const url = item.url || '#';
        html += `<a class="link-card" href="${escapeAttr(url)}" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">${escapeHtml(icon)}</span>
          <span class="link-label">${escapeHtml(label)}</span>
          <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>`;
      });
      html += `</div></section>`;
    });

    if (grouped['_other'] && grouped['_other'].length) {
      html += `<section class="category"><div class="category-head"><h2 class="category-title">Other</h2><span class="category-count">${grouped['_other'].length}</span></div><div class="links">`;
      grouped['_other'].forEach(item => {
        html += `<a class="link-card" href="${escapeAttr(item.url||'#')}" target="_blank" rel="noopener">
          <span class="link-icon">${escapeHtml(item.icon||'📄')}</span>
          <span class="link-label">${escapeHtml(item.label||'Untitled')}</span>
        </a>`;
      });
      html += `</div></section>`;
    }

    contentEl.innerHTML = html;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) { render(allRows); return; }
    const filtered = allRows.filter(r =>
      (r.label || '').toLowerCase().includes(q) ||
      (r.category || '').toLowerCase().includes(q)
    );
    if (!filtered.length) {
      contentEl.innerHTML = `<div class="empty-search">No matches for "${escapeHtml(q)}".</div>`;
      return;
    }
    render(filtered);
  }

  searchEl.addEventListener('input', applyFilter);

  async function load() {
    if (SHEET_CSV_URL === "PASTE_YOUR_PUBLISHED_CSV_URL_HERE") {
      showError(`<strong>Setup needed:</strong> Paste your published Google Sheet CSV URL into the <code>SHEET_CSV_URL</code> constant near the top of the script.<br><br>To get the URL:<br>1. Open your Google Sheet → <em>File → Share → Publish to web</em><br>2. Choose the sheet tab, format = <em>Comma-separated values (.csv)</em><br>3. Publish, copy the URL, paste it in this file.`);
      return;
    }
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = rowsToObjects(parseCSV(text));
      // Only include rows marked active (or where active column is blank/missing)
      allRows = rows.filter(r => {
        const a = (r.active || '').toLowerCase();
        return a === '' || a === 'yes' || a === 'y' || a === 'true' || a === '1';
      });
      if (!allRows.length) {
        showError('The sheet loaded but has no active rows. Check that your sheet has columns: Category, Icon, Label, URL, Active.');
        return;
      }
      statusEl.remove();
      render(allRows);
    } catch (err) {
      showError(`Could not load the sheet. Check that the sheet is published to web as CSV and the URL is correct.<br><br><code>${escapeHtml(err.message)}</code>`);
    }
  }

  load();
</script>
